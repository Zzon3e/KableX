<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KableX{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #FFFFFF;
            color: #000000;
        }
        
        header {
            background-color: #1F3A5F;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        nav {
            background-color: #4DA3FF;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        nav a:hover {
            background-color: #1F3A5F;
        }
        
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #4DA3FF;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
            margin-right: 5px;
        }
        
        .btn:hover {
            background-color: #1F3A5F;
        }
        
        .btn-danger {
            background-color: #dc3545;
        }
        
        .btn-danger:hover {
            background-color: #c82333;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        table th, table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        table th {
            background-color: #1F3A5F;
            color: white;
        }
        
        table tr:hover {
            background-color: #f5f5f5;
        }
        
        .form-control {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        footer {
            background-color: #1F3A5F;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
        
        @media (max-width: 768px) {
            nav {
                gap: 5px;
            }
            
            nav a {
                padding: 8px 10px;
                font-size: 12px;
            }
            
            table {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🔌 KableX</h1>
        <p>Medlemsadministrasjonssystem</p>
    </header>
    
    <nav>
        <a href="{% url 'products:medlem_list' %}">Medlemmer</a>
        <a href="{% url 'products:medlem_create' %}">+ Medlem</a>
        <a href="{% url 'products:aktivitet_list' %}">Aktiviteter</a>
        <a href="{% url 'products:aktivitet_create' %}">+ Aktivitet</a>
        <a href="{% url 'products:pamelding_list' %}">Påmeldinger</a>
        <a href="{% url 'products:betaling_list' %}">Betalinger</a>
    </nav>
    
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
    
    <footer>
        <p>&copy; 2026 KableX</p>
    </footer>
</body>
</html>
